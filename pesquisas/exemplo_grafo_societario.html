<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo Societário Interativo - Startuzeiro</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        #header {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(51, 65, 85, 0.6);
            backdrop-filter: blur(8px);
        }
        #header h1 { margin: 0 0 4px 0; font-size: 16px; font-weight: 700; color: #60a5fa; }
        #header p { margin: 0; font-size: 12px; color: #94a3b8; }
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(51, 65, 85, 0.6);
            font-size: 12px;
            display: flex;
            gap: 16px;
        }
        .legend-item { display: flex; items-center; gap: 6px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-top: 2px; }
        .link { stroke: #475569; stroke-opacity: 0.6; stroke-width: 1.5px; }
        .link-label { font-size: 9px; fill: #94a3b8; text-anchor: middle; pointer-events: none; }
        .node { cursor: pointer; }
        .node-label { font-size: 11px; fill: #f1f5f9; font-weight: 600; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        #tooltip {
            position: absolute;
            display: none;
            background: #1e293b;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid #334155;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🌐 Visualizador de Rede Societária & B2B</h1>
        <p>Arraste os nós para navegar. Scroll para zoom.</p>
    </div>

    <div id="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#3b82f6;"></span> Pessoa Física</div>
        <div class="legend-item"><span class="legend-dot" style="background:#10b981;"></span> Pessoa Jurídica / Empresa</div>
    </div>

    <div id="tooltip"></div>
    <svg id="graph" width="100%" height="100vh"></svg>

    <script>
        const data = {"nodes": [{"id": "Vitor Fundador", "name": "Vitor Fundador", "tipo": "pessoa", "color": "#3b82f6", "detalhes": "{'tipo': 'pessoa', 'cargo': 'Fundador & CEO'}"}, {"id": "Startuzeiro Tech", "name": "Startuzeiro Tech", "tipo": "empresa", "color": "#10b981", "detalhes": "{'tipo': 'empresa', 'cnpj': '11.111.111/0001-22', 'setor': 'Software & IA'}"}, {"id": "Investidor Anjo", "name": "Investidor Anjo", "tipo": "pessoa", "color": "#3b82f6", "detalhes": "{'tipo': 'pessoa', 'cargo': 'Angel Investor'}"}, {"id": "Holding Participações", "name": "Holding Participações", "tipo": "empresa", "color": "#10b981", "detalhes": "{'tipo': 'empresa', 'cnpj': '22.222.222/0001-33', 'setor': 'Holding'}"}, {"id": "Fundo Venture Capital", "name": "Fundo Venture Capital", "tipo": "empresa", "color": "#10b981", "detalhes": "{'tipo': 'empresa', 'cnpj': '33.333.333/0001-44', 'setor': 'Venture Capital'}"}, {"id": "Fintech Parceira", "name": "Fintech Parceira", "tipo": "empresa", "color": "#10b981", "detalhes": "{'tipo': 'empresa', 'cnpj': '44.444.444/0001-55', 'setor': 'Fintech'}"}, {"id": "Sócio Oculto", "name": "Sócio Oculto", "tipo": "pessoa", "color": "#3b82f6", "detalhes": "{'tipo': 'pessoa', 'cargo': 'Diretor Operacional'}"}], "links": [{"source": "Vitor Fundador", "target": "Startuzeiro Tech", "label": "SÓCIO_FUNDADOR", "detalhe": "60% das quotas"}, {"source": "Investidor Anjo", "target": "Startuzeiro Tech", "label": "INVESTIU_EM", "detalhe": "R$ 500k Seed"}, {"source": "Investidor Anjo", "target": "Holding Participações", "label": "SÓCIO_ADMINISTRADOR", "detalhe": "Controle 80%"}, {"source": "Holding Participações", "target": "Fintech Parceira", "label": "CONTROLADORA", "detalhe": "Participação Majoritária"}, {"source": "Fundo Venture Capital", "target": "Fintech Parceira", "label": "INVESTIU_EM", "detalhe": "Série A R$ 12M"}, {"source": "Sócio Oculto", "target": "Holding Participações", "label": "CONSELHEIRO", "detalhe": "Membro do Conselho"}, {"source": "Sócio Oculto", "target": "Startuzeiro Tech", "label": "MENTOR_ADVISOR", "detalhe": "Equity 5%"}]};
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph");
        const g = svg.append("g");

        // Zoom & Pan
        svg.call(d3.zoom().scaleExtent([0.3, 4]).on("zoom", (event) => {
            g.attr("transform", event.transform);
        }));

        // Simulation
        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(140))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(40));

        // Links
        const link = g.append("g")
            .selectAll("line")
            .data(data.links)
            .join("line")
            .attr("class", "link");

        // Link Labels
        const linkLabel = g.append("g")
            .selectAll("text")
            .data(data.links)
            .join("text")
            .attr("class", "link-label")
            .text(d => d.label);

        // Nodes
        const tooltip = d3.select("#tooltip");
        const node = g.append("g")
            .selectAll("g")
            .data(data.nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", d => d.tipo === "pessoa" ? 14 : 18)
            .attr("fill", d => d.color)
            .attr("stroke", "#fff")
            .attr("stroke-width", 1.5);

        node.append("text")
            .attr("class", "node-label")
            .attr("x", 22)
            .attr("y", 4)
            .text(d => d.name);

        node.on("mouseover", (event, d) => {
            tooltip.style("display", "block")
                .html(`<strong>${d.name}</strong><br>Tipo: ${d.tipo}<br>Info: ${d.detalhes}`)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 20) + "px");
        }).on("mouseout", () => {
            tooltip.style("display", "none");
        });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            linkLabel
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2 - 4);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
